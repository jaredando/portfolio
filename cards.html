<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#102e27">
  <title>Jared in Tech | Pick a Card</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "framer-motion": "https://esm.sh/framer-motion@11.0.8?deps=react@18.2.0,react-dom@18.2.0",
        "lucide-react": "https://esm.sh/lucide-react@0.358.0?deps=react@18.2.0"
      }
    }
  </script>

  <style>
    :root {
      --felt: #123b32;
      --felt-dark: #08251f;
      --ink: #17332d;
      --cream: #f5edda;
      --cream-deep: #e8dcc2;
      --gold: #d3b36a;
      --rail: #321c13;
      --rail-light: #6c3f27;
    }

    * { box-sizing: border-box; }

    html, body, #root { min-height: 100%; }

    html { background: var(--felt-dark); }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--felt-dark);
      color: var(--cream);
      font-family: "Space Grotesk", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }

    .table-surface {
      position: relative;
      min-height: 100svh;
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 38%, rgba(62, 125, 102, 0.35), transparent 38%),
        radial-gradient(circle at 50% 50%, transparent 42%, rgba(2, 17, 14, 0.72) 115%),
        linear-gradient(135deg, #16483d, #0d312a 70%);
    }

    .table-surface::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      opacity: 0.38;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(2deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(92deg, rgba(0,0,0,0.035) 0 1px, transparent 1px 5px);
      mix-blend-mode: soft-light;
    }

    .table-surface::after {
      content: "";
      position: absolute;
      inset: 14px;
      z-index: -1;
      border: 1px solid rgba(214, 184, 119, 0.28);
      border-radius: 30px;
      box-shadow:
        inset 0 0 0 6px rgba(0,0,0,0.17),
        inset 0 0 70px rgba(0,0,0,0.2),
        0 0 0 14px rgba(48, 27, 18, 0.9),
        0 0 0 18px rgba(114, 67, 41, 0.55);
      pointer-events: none;
    }

    .font-card { font-family: "Cormorant Garamond", Georgia, serif; }
    .font-mono { font-family: "DM Mono", ui-monospace, monospace; }

    .brand-mark {
      background: rgba(4, 24, 20, 0.45);
      border: 1px solid rgba(232, 220, 194, 0.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 25px rgba(0,0,0,0.16);
      backdrop-filter: blur(12px);
    }

    .table-note {
      position: absolute;
      width: min(245px, 36vw);
      padding: 18px 20px 16px;
      color: #4b3822;
      background:
        linear-gradient(150deg, rgba(255,255,255,0.45), transparent 35%),
        #e8d7aa;
      box-shadow: 0 15px 24px rgba(0,0,0,0.2);
      transform: rotate(-4deg);
    }

    .table-note::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(91, 66, 37, 0.22);
      pointer-events: none;
    }

    .table-note::after {
      content: "";
      position: absolute;
      top: -9px;
      left: 50%;
      width: 48px;
      height: 18px;
      transform: translateX(-50%) rotate(2deg);
      background: rgba(236, 217, 166, 0.55);
      border: 1px solid rgba(126, 98, 53, 0.12);
    }

    .stage {
      position: relative;
      width: 100%;
      min-height: 590px;
      perspective: 1500px;
      perspective-origin: center 46%;
    }

    .fan-card {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 248px;
      height: 354px;
      margin-left: -124px;
      margin-top: -177px;
      cursor: grab;
      touch-action: pan-y;
      transform-origin: center 120%;
      will-change: transform;
    }

    .fan-card:active { cursor: grabbing; }

    .card-shell {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    .playing-card {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 16px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-front {
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,0.58), transparent 42%),
        linear-gradient(145deg, #fbf6e9, var(--cream) 48%, #ede2ca);
      border: 1px solid rgba(255,255,255,0.72);
      box-shadow:
        0 18px 24px rgba(0,0,0,0.27),
        0 3px 2px rgba(0,0,0,0.18),
        inset 0 0 0 5px rgba(103, 76, 44, 0.08);
    }

    .card-front::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(33, 66, 57, 0.2);
      border-radius: 10px;
      pointer-events: none;
    }

    .card-front::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.14;
      background-image:
        repeating-linear-gradient(0deg, rgba(61, 47, 28, 0.08) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(90deg, rgba(61, 47, 28, 0.05) 0 1px, transparent 1px 5px);
      mix-blend-mode: multiply;
    }

    .card-back {
      padding: 12px;
      background: #ede1c8;
      border: 1px solid rgba(255,255,255,0.72);
      box-shadow:
        0 18px 24px rgba(0,0,0,0.3),
        0 3px 2px rgba(0,0,0,0.2),
        inset 0 0 0 4px rgba(103, 76, 44, 0.08);
    }

    .card-back-pattern {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 2px solid rgba(232, 220, 194, 0.82);
      border-radius: 9px;
      background-color: #173b36;
      background-image:
        linear-gradient(45deg, rgba(213, 181, 106, 0.28) 25%, transparent 25%, transparent 75%, rgba(213, 181, 106, 0.28) 75%),
        linear-gradient(-45deg, rgba(213, 181, 106, 0.22) 25%, transparent 25%, transparent 75%, rgba(213, 181, 106, 0.22) 75%);
      background-position: 0 0, 11px 11px;
      background-size: 22px 22px;
      box-shadow: inset 0 0 0 4px #173b36, inset 0 0 0 6px rgba(232,220,194,0.72);
    }

    .card-back-pattern::before,
    .card-back-pattern::after {
      content: "";
      position: absolute;
      inset: 15%;
      border: 1px solid rgba(232,220,194,0.66);
      border-radius: 50%;
      transform: rotate(45deg);
    }

    .card-back-pattern::after {
      inset: 27%;
      border-radius: 10px;
      background: rgba(15, 49, 43, 0.46);
    }

    .corner {
      position: absolute;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 40px;
      gap: 1px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 700;
      line-height: 0.82;
    }

    .corner-top { top: 17px; left: 12px; }
    .corner-bottom { right: 12px; bottom: 17px; transform: rotate(180deg); }
    .corner-rank { font-size: 28px; }
    .corner-suit { font-size: 20px; }

    .card-center {
      position: absolute;
      inset: 53px 25px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .card-medallion {
      display: grid;
      width: 82px;
      height: 82px;
      margin-bottom: 18px;
      place-items: center;
      border: 1px solid rgba(24, 57, 49, 0.2);
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      box-shadow: inset 0 0 0 5px rgba(255,255,255,0.22);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 44px;
      font-weight: 700;
    }

    .detail-glass {
      position: relative;
      width: 100%;
      height: 150px;
      margin: 14px 0 15px;
      overflow: hidden;
      border: 1px solid rgba(112, 91, 48, 0.42);
      border-radius: 13px;
      background:
        radial-gradient(circle at 46% 40%, rgba(255,255,255,0.84), rgba(211, 221, 207, 0.64) 52%, rgba(45, 85, 76, 0.5)),
        #ccd9cf;
      box-shadow:
        0 8px 15px rgba(44, 61, 52, 0.12),
        0 0 0 4px rgba(214, 192, 141, 0.22),
        0 0 0 5px rgba(56, 73, 62, 0.13),
        inset 0 0 0 4px rgba(255,255,255,0.42),
        inset 0 -12px 22px rgba(22, 67, 58, 0.28);
      isolation: isolate;
    }

    .detail-glass iframe {
      position: absolute;
      inset: 0;
      width: 275%;
      height: 275%;
      border: 0;
      opacity: 0.8;
      filter: saturate(0.66) contrast(0.9) brightness(0.96) sepia(0.14);
      pointer-events: none;
      transform: scale(0.364);
      transform-origin: top left;
    }

    .detail-glass img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      opacity: 0.88;
      filter: saturate(0.78) contrast(0.92) brightness(0.98) sepia(0.08);
    }

    .detail-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 48%, transparent 42%, rgba(10, 48, 42, 0.3) 100%),
        linear-gradient(145deg, rgba(255,255,255,0.72), transparent 25%, transparent 66%, rgba(255,255,255,0.2));
      mix-blend-mode: screen;
    }

    .detail-glass::after {
      content: "";
      position: absolute;
      inset: 5px;
      z-index: 3;
      border: 1px solid rgba(255,255,255,0.38);
      border-radius: 9px;
      pointer-events: none;
    }

    .detail-glass-label {
      position: absolute;
      left: 13px;
      bottom: 10px;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(250, 246, 231, 0.88);
      font-family: "DM Mono", ui-monospace, monospace;
      font-size: 7px;
      letter-spacing: 0.18em;
      line-height: 1;
      text-shadow: 0 1px 8px rgba(2, 17, 14, 0.78);
      text-transform: uppercase;
      pointer-events: none;
    }

    .detail-glass-dot {
      width: 6px;
      height: 6px;
      border: 1px solid rgba(250, 246, 231, 0.82);
      border-radius: 50%;
      background: rgba(166, 217, 190, 0.72);
      box-shadow: 0 0 0 3px rgba(166, 217, 190, 0.14);
    }

    .glass-sheen {
      position: absolute;
      top: -28%;
      bottom: -28%;
      left: -58%;
      z-index: 4;
      width: 42%;
      opacity: 0;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.64), transparent);
      filter: blur(4px);
      transform: skewX(-16deg);
    }

    .card-title {
      max-width: 190px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 33px;
      font-weight: 700;
      line-height: 0.88;
      letter-spacing: -0.05em;
    }

    .card-caption {
      margin-top: 13px;
      font-family: "DM Mono", ui-monospace, monospace;
      font-size: 8px;
      letter-spacing: 0.22em;
      line-height: 1.5;
      text-transform: uppercase;
      opacity: 0.68;
    }

    .active-card .card-front {
      box-shadow:
        0 28px 35px rgba(0,0,0,0.35),
        0 4px 2px rgba(0,0,0,0.2),
        0 0 0 2px rgba(211, 179, 106, 0.45),
        inset 0 0 0 5px rgba(103, 76, 44, 0.08);
    }

    .detail-card .glass-sheen {
      animation: glass-pass 980ms 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes glass-pass {
      0% { left: -58%; opacity: 0; }
      22% { opacity: 0.78; }
      100% { left: 128%; opacity: 0; }
    }

    .deck-pile {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 248px;
      height: 354px;
      margin-left: -124px;
      margin-top: -177px;
      cursor: pointer;
      border: 0;
      border-radius: 16px;
      background: transparent;
      color: inherit;
    }

    .deck-layer {
      position: absolute;
      inset: 0;
      border-radius: 16px;
    }

    .deck-cta {
      position: absolute;
      left: 50%;
      bottom: -82px;
      width: max-content;
      transform: translateX(-50%);
    }

    .pill-button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 16px;
      cursor: pointer;
      border: 1px solid rgba(232, 220, 194, 0.2);
      border-radius: 999px;
      background: rgba(4, 25, 21, 0.62);
      color: var(--cream);
      box-shadow: 0 12px 22px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.06);
      font-family: "DM Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: background-color 180ms ease, border-color 180ms ease, color 180ms ease;
      backdrop-filter: blur(12px);
    }

    .pill-button:hover {
      border-color: rgba(232, 220, 194, 0.48);
      background: rgba(8, 39, 33, 0.86);
    }

    .pill-button:focus-visible,
    .deck-pile:focus-visible,
    .fan-card:focus-visible,
    .close-button:focus-visible,
    .project-action:focus-visible {
      outline: 3px solid #f2d88f;
      outline-offset: 4px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(2, 13, 11, 0.82);
      backdrop-filter: blur(8px);
    }

    .picked-wrap {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 20px;
      pointer-events: none;
      perspective: 1800px;
    }

    .picked-card {
      position: relative;
      width: min(390px, calc(100vw - 36px));
      height: min(560px, calc(100svh - 110px));
      pointer-events: auto;
    }

    .detail-card {
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,0.68), transparent 47%),
        linear-gradient(145deg, #fbf6e9, var(--cream) 48%, #e9dcc1);
      border: 1px solid rgba(255,255,255,0.75);
      box-shadow: 0 30px 70px rgba(0,0,0,0.48), inset 0 0 0 6px rgba(103, 76, 44, 0.08);
      transform: rotateY(180deg);
    }

    .detail-card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(33, 66, 57, 0.22);
      border-radius: 10px;
      pointer-events: none;
    }

    .detail-content {
      position: relative;
      z-index: 2;
      display: flex;
      height: 100%;
      flex-direction: column;
      padding: 28px 28px 24px;
    }

    .detail-title {
      margin: 4px 0 0;
      color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(39px, 8vw, 53px);
      font-weight: 700;
      letter-spacing: -0.065em;
      line-height: 0.83;
    }

    .detail-kicker,
    .detail-label {
      color: rgba(23,51,45,0.68);
      font-family: "DM Mono", ui-monospace, monospace;
      font-size: 9px;
      letter-spacing: 0.19em;
      line-height: 1.55;
      text-transform: uppercase;
    }

    .detail-desc {
      margin: 0;
      color: rgba(23,51,45,0.88);
      font-size: 12px;
      line-height: 1.52;
    }

    .detail-divider {
      width: 100%;
      height: 1px;
      margin: 13px 0 11px;
      background: rgba(23,51,45,0.16);
    }

    .tech-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
    }

    .tech-chip {
      padding: 5px 7px;
      border: 1px solid rgba(23,51,45,0.16);
      border-radius: 999px;
      color: rgba(23,51,45,0.78);
      background: rgba(255,255,255,0.18);
      font-family: "DM Mono", ui-monospace, monospace;
      font-size: 7px;
      letter-spacing: 0.11em;
      line-height: 1;
      text-transform: uppercase;
    }

    .detail-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: auto;
      padding-top: 14px;
    }

    .detail-actions-single {
      grid-template-columns: 1fr;
    }

    .project-action {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid rgba(23,51,45,0.2);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255,255,255,0.2);
      font-family: "DM Mono", ui-monospace, monospace;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease;
    }

    .project-action:hover {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--cream);
    }

    .project-action-primary {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--cream);
    }

    .project-action-primary:hover {
      border-color: #285a50;
      background: #285a50;
    }

    .close-button {
      position: fixed;
      top: 28px;
      right: 28px;
      z-index: 60;
      display: grid;
      width: 48px;
      height: 48px;
      cursor: pointer;
      place-items: center;
      border: 1px solid rgba(232, 220, 194, 0.24);
      border-radius: 50%;
      color: var(--cream);
      background: rgba(4, 25, 21, 0.72);
      transition: background-color 180ms ease, border-color 180ms ease;
      backdrop-filter: blur(12px);
    }

    .close-button:hover {
      border-color: rgba(232, 220, 194, 0.52);
      background: rgba(9, 45, 38, 0.92);
    }

    .desktop-note { display: block; }
    .mobile-hint { display: none; }

    @media (max-width: 760px) {
      .table-surface::after {
        inset: 8px;
        border-radius: 21px;
        box-shadow:
          inset 0 0 0 4px rgba(0,0,0,0.17),
          inset 0 0 46px rgba(0,0,0,0.2),
          0 0 0 7px rgba(48, 27, 18, 0.92),
          0 0 0 10px rgba(114, 67, 41, 0.52);
      }

      .stage { min-height: 500px; }

      .fan-card,
      .deck-pile {
        width: 184px;
        height: 266px;
        margin-left: -92px;
        margin-top: -133px;
      }

      .playing-card { border-radius: 13px; }
      .card-front::before { inset: 6px; border-radius: 8px; }
      .card-back { padding: 9px; }
      .card-back-pattern { border-radius: 7px; }
      .corner { width: 31px; }
      .corner-top { top: 13px; left: 9px; }
      .corner-bottom { right: 9px; bottom: 13px; }
      .corner-rank { font-size: 22px; }
      .corner-suit { font-size: 16px; }
      .card-center { inset: 42px 18px; }
      .card-medallion { width: 60px; height: 60px; margin-bottom: 12px; font-size: 34px; }
      .card-title { max-width: 150px; font-size: 25px; }
      .card-caption { margin-top: 9px; font-size: 7px; }
      .deck-cta { bottom: -74px; }
      .desktop-note { display: none; }
      .mobile-hint { display: block; }

      .detail-content { padding: 27px 26px 24px; }
      .detail-glass { height: 138px; margin-top: 12px; margin-bottom: 13px; }
      .detail-desc { font-size: 11.5px; }
      .detail-divider { margin: 12px 0 10px; }
      .detail-actions { padding-top: 12px; }
      .project-action { min-height: 43px; font-size: 8px; }
      .close-button { top: 18px; right: 18px; width: 44px; height: 44px; }
    }

    @media (max-height: 700px) {
      .stage { min-height: 450px; }
      .picked-card { height: min(520px, calc(100svh - 88px)); }
      .detail-content { padding-top: 22px; padding-bottom: 19px; }
      .detail-glass { height: 116px; margin-top: 10px; margin-bottom: 10px; }
      .detail-divider { margin: 10px 0 8px; }
      .tech-list { gap: 5px; margin-top: 7px; }
      .tech-chip { padding: 5px 7px; }
      .detail-actions { padding-top: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
    .portfolio-return {
      position: absolute; right: 20px; top: 25px; z-index: 35;
      display: inline-flex; align-items: center; min-height: 44px;
      background: #f5edda; color: #17332d; padding: 8px 15px;
      border-radius: 24px; font-size: 13px; text-decoration: none;
    }
    .project-picker {
      position: relative; z-index: 20; display: flex; flex-wrap: wrap;
      justify-content: center; gap: 8px; max-width: 650px;
      padding: 0; list-style: none; margin: 0;
    }
    .project-picker button {
      min-height: 44px; padding: 6px 12px; color: #f5edda;
      border: 1px solid #a49569; border-radius: 6px; cursor: pointer;
    }
    .project-picker button:hover, .portfolio-return:hover { background: #e8dcc2; color: #17332d; }
    .project-picker button:focus-visible, .portfolio-return:focus-visible {
      outline: 2px solid #f2d88f; outline-offset: 3px;
    }
    @media (max-width: 420px) {
      .portfolio-return { top: 30px; right: 12px; padding-inline: 10px; }
      .table-surface header { left: 12px; }
    }
  </style>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="canonical" href="https://jaredin.tech/cards.html">
  <meta name="description" content="Explore Jared Anderson’s projects as a deck of playing cards.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Jared in Tech | View as cards">
  <meta property="og:description" content="Explore Jared Anderson’s projects as a deck of playing cards.">
  <meta property="og:url" content="https://jaredin.tech/cards.html">
  <meta property="og:image" content="https://jaredin.tech/assets/portfolio-share.png">
  <meta property="og:image:alt" content="Jared Anderson — architecture and products portfolio">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body><a class="portfolio-return" href="index.html">Back to portfolio</a>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useCallback, useEffect, useRef, useState } from "react";
    import { createRoot } from "react-dom/client";
    import { AnimatePresence, motion, useReducedMotion } from "framer-motion";
    import {
      ArrowUpRight,
      Github,
      Layers3,
      X
    } from "lucide-react";

    const projects = [
      { id: "clubshed", title: "Clubshed", rank: "A", suit: "♣", accent: "#2f7d67", kicker: "Club operations", description: "Taking an AI-assisted MVP toward production for UNSW-ES Bulldogs. Cloudflare infrastructure, stronger access controls and 75% lower infrastructure costs. Currently in testing.", tech: ["TypeScript", "Hono", "Cloudflare", "D1", "R2"], live: "./clubshed.html", previewImage: "./assets/clubshed-dashboard.png" },
      { id: "bulldogs", title: "Bulldogs", rank: "K", suit: "♦", accent: "#327f9a", kicker: "Club website", description: "A new website for UNSW-ES Bulldogs AFL Club, currently available as a test build.", tech: ["HTML", "CSS", "JavaScript"], live: "https://newbulldogs.clubshed.app" },
      { id: "tumble", title: "Tumble", rank: "Q", suit: "♥", accent: "#b64b4b", kicker: "Mobile web game", description: "Hold to tuck. Release to open. Land on your feet. A timing-based browser game for your phone.", tech: ["Canvas", "JavaScript", "Web Audio"], live: "./tumble.html" },
      {
        id: "team-sheet",
        title: "Team Sheet",
        rank: "A",
        suit: "\u2660",
        accent: "#2f7d67",
        kicker: "Match-day board",
        description: "A drag-and-drop AFL team selection board with an oval layout, magnet-style player tokens, multi-board persistence and a locked read-only view for visitors.",
        tech: ["HTML5", "SVG", "JavaScript", "npoint.io"],
        repo: "https://github.com/jaredando/AFLselector",
        live: "https://jaredando.github.io/AFLselector/?view=1"
      },
      {
        id: "outsider",
        title: "Outsider",
        rank: "K",
        suit: "\u2665",
        accent: "#b64b4b",
        kicker: "Social deduction game",
        description: "A Spyfall-meets-mafia party game with Locations, TV, Movies and AI modes. Players hold to peek at their role, then bluff, vote and try to spot the outsider.",
        tech: ["HTML5", "JavaScript", "Anthropic API", "Gemini API"],
        repo: "https://github.com/jaredando/Outsider",
        live: "https://jaredando.github.io/Outsider"
      },
      {
        id: "invoicer",
        title: "Invoicer",
        rank: "Q",
        suit: "\u2663",
        accent: "#327f9a",
        kicker: "Sole trader utility",
        description: "A zero-friction invoice maker for Australian sole traders. It includes saved profiles, client records, ABN and BSB fields, line items and one-click PDF export.",
        tech: ["HTML5", "JavaScript", "PDF Export", "LocalStorage"],
        repo: "https://github.com/jaredando/soletrader",
        live: "https://jaredando.github.io/soletrader"
      },
      {
        id: "squad-logic",
        title: "SquadLogic",
        rank: "J",
        suit: "\u2666",
        accent: "#b47a2f",
        kicker: "Squad management tool",
        description: "A game-day squad management tool for AFL coaches, built to make selection logic easier to reason about when a match-day list starts getting complicated.",
        tech: ["HTML5", "JavaScript", "CSS"],
        repo: "https://github.com/jaredando/SquadLogic",
        live: "https://jaredando.github.io/SquadLogic"
      },
      {
        id: "finetune",
        title: "Finetune",
        rank: "10",
        suit: "\u2660",
        accent: "#2e6ff2",
        kicker: "Intune admin companion",
        description: "A local-first browser side panel for Microsoft Intune admins to search policies, trace assignments and read settings in plain language without getting lost in the portal.",
        tech: ["React", "TypeScript", "Browser Extension", "Microsoft Graph"],
        live: "https://finetune.tools",
        previewImage: "./assets/finetune-preview.png"
      }
    ];

    const spring = { type: "spring", stiffness: 310, damping: 28, mass: 0.78 };
    const instant = { duration: 0 };

    function CardBack() {
      return (
        <div className="playing-card card-back" aria-hidden="true">
          <div className="card-back-pattern" />
        </div>
      );
    }

    function DetailGlass({ project }) {
      return (
        <motion.div
          className="detail-glass"
          initial={{ opacity: 0, scale: 0.96, rotateX: -5 }}
          animate={{ opacity: 1, scale: 1, rotateX: 0 }}
          transition={{ type: "spring", stiffness: 240, damping: 24, mass: 0.82, delay: 0.34 }}
        >
          {project.previewImage ? (
            <img
              src={project.previewImage}
              alt=""
              aria-hidden="true"
            />
          ) : (
            <iframe
              src={project.live}
              title={`${project.title} reflected live preview`}
              tabIndex={-1}
              aria-hidden="true"
              loading="lazy"
              sandbox="allow-scripts allow-same-origin"
            />
          )}
          <span className="detail-glass-label">
            <span className="detail-glass-dot" />
            {project.previewImage ? "Site preview" : "Live reflection"}
          </span>
          <span className="glass-sheen" />
        </motion.div>
      );
    }

    function CardFront({ project }) {
      return (
        <div className="playing-card card-front" aria-hidden="true">
          <div className="corner corner-top" style={{ color: project.accent }}>
            <span className="corner-rank">{project.rank}</span>
            <span className="corner-suit">{project.suit}</span>
          </div>
          <div className="card-center">
            <div className="card-medallion" style={{ color: project.accent }}>
              {project.suit}
            </div>
            <h3 className="card-title">{project.title}</h3>
            <p className="card-caption">{project.kicker}</p>
          </div>
          <div className="corner corner-bottom" style={{ color: project.accent }}>
            <span className="corner-rank">{project.rank}</span>
            <span className="corner-suit">{project.suit}</span>
          </div>
        </div>
      );
    }

    function DealPile({ onDeal, reducedMotion, hasOpened }) {
      return (
        <motion.button
          className="deck-pile"
          type="button"
          aria-label={hasOpened ? "Open the project deck again" : "Open the project deck"}
          onClick={onDeal}
          initial={reducedMotion ? false : { opacity: 0, y: -70, rotateZ: -5 }}
          animate={{ opacity: 1, y: 0, rotateZ: -2 }}
          exit={{ opacity: 0, y: 22, scale: 0.9, rotateZ: 0 }}
          whileHover={reducedMotion ? undefined : { y: -12, rotateZ: 0 }}
          whileTap={reducedMotion ? undefined : { scale: 0.94, y: 5 }}
          transition={reducedMotion ? instant : spring}
        >
          {[3, 2, 1, 0].map((layer) => (
            <motion.div
              className="deck-layer"
              key={layer}
              style={{
                x: layer * -3,
                y: layer * 3,
                rotateZ: layer * -0.7,
                zIndex: 4 - layer
              }}
            >
              <CardBack />
            </motion.div>
          ))}
          <span className="deck-cta pill-button">
            <Layers3 size={15} />
            {hasOpened ? "Open the deck again" : "Open the deck"}
          </span>
        </motion.button>
      );
    }

    function FanCard({
      project,
      index,
      count,
      current,
      compact,
      touchMode,
      viewportWidth,
      onPick,
      onMakeCurrent,
      onClearCurrent,
      reducedMotion
    }) {
      const offset = index - ((count - 1) / 2);
      const spacing = Math.min(compact ? 40 : 110, Math.max(12, (viewportWidth - (compact ? 230 : 320)) / (count - 1)));
      const rotation = compact ? 8.5 : 10;
      const x = current && compact ? 0 : offset * spacing;
      const y = Math.abs(offset) * (compact ? 14 : 25) + (current ? (compact ? -68 : -34) : 0);
      const rotateZ = current ? 0 : offset * rotation;

      const handleDragEnd = (_, info) => {
        if (info.offset.y < -58 || info.velocity.y < -480) onPick(project);
      };

      return (
        <motion.button
          className={`fan-card ${current ? "active-card" : ""}`}
          type="button"
          aria-label={`Pick up ${project.title}`}
          aria-current={current ? "true" : undefined}
          initial={reducedMotion ? false : { x: 0, y: 90, rotateZ: 0, opacity: 0, scale: 0.82 }}
          animate={{
            x,
            y,
            rotateZ,
            opacity: 1,
            scale: current ? 1.04 : 1,
            zIndex: current ? 30 : index + 1
          }}
          exit={{
            x: 0,
            y: 44,
            rotateZ: index % 2 === 0 ? -1.5 : 1.5,
            opacity: 0,
            scale: 0.86,
            transition: reducedMotion ? instant : { ...spring, delay: (count - index) * 0.035 }
          }}
          whileHover={reducedMotion ? undefined : { y: y - 18, scale: current ? 1.075 : 1.045 }}
          whileTap={reducedMotion ? undefined : { scale: 0.99 }}
          whileDrag={reducedMotion ? undefined : { scale: 1.08, y: y - 18, cursor: "grabbing" }}
          drag={!reducedMotion && current}
          dragConstraints={{ left: -36, right: 36, top: -110, bottom: 24 }}
          dragElastic={0.16}
          dragSnapToOrigin
          onDragEnd={handleDragEnd}
          onMouseEnter={() => !touchMode && !compact && onMakeCurrent()}
          onMouseLeave={onClearCurrent}
          onFocus={() => !touchMode && !compact && onMakeCurrent()}
          onClick={() => onPick(project)}
          transition={reducedMotion ? instant : { ...spring, delay: index * 0.045 }}
        >
          <CardFront project={project} />
        </motion.button>
      );
    }

    function ProjectReveal({ project }) {
      return (
        <div className="playing-card detail-card">
          <div className="detail-content">
            <div className="flex items-start justify-between gap-4">
              <div>
                <p className="detail-kicker" style={{ color: project.accent }}>
                  {project.rank}{project.suit} / {project.kicker}
                </p>
                <h2 className="detail-title" id="project-title">{project.title}</h2>
              </div>
              <span className="font-card text-[58px] leading-none" style={{ color: project.accent }}>
                {project.suit}
              </span>
            </div>

            <DetailGlass project={project} />
            <p className="detail-desc">{project.description}</p>
            <div className="detail-divider" />

            <div>
              <p className="detail-label">Built with</p>
              <div className="tech-list">
                {project.tech.map((item) => (
                  <span className="tech-chip" key={item}>{item}</span>
                ))}
              </div>
            </div>

            <div className={`detail-actions ${project.repo ? "" : "detail-actions-single"}`}>
              {project.repo && (
                <a
                  className="project-action"
                  href={project.repo}
                  target="_blank"
                  rel="noreferrer"
                >
                  <Github size={14} />
                  Source
                </a>
              )}
              <a
                className="project-action project-action-primary"
                href={project.live}
                target="_blank"
                rel="noreferrer"
              >
                Live site
                <ArrowUpRight size={14} />
              </a>
            </div>
          </div>
        </div>
      );
    }

    function PickedCard({ project, onClose, reducedMotion, returning }) {
      const closeRef = useRef(null);

      useEffect(() => {
        closeRef.current?.focus();
      }, []);

      return (
        <div role="dialog" aria-modal="true" aria-labelledby="project-title" data-project-dialog>
          <motion.button
            className="modal-backdrop"
            tabIndex={-1}
            type="button"
            aria-label="Close project card"
            onClick={onClose}
            initial={{ opacity: 0 }}
            animate={{ opacity: returning ? 0.08 : 1 }}
            exit={{ opacity: 0 }}
            transition={reducedMotion ? instant : { duration: returning ? 0.52 : 0.2 }}
          />

          <motion.button
            ref={closeRef}
            className="close-button"
            type="button"
            aria-label="Put card back on the table"
            onClick={onClose}
            disabled={returning}
            initial={reducedMotion ? false : { opacity: 0, scale: 0.8 }}
            animate={{ opacity: returning ? 0 : 1, scale: returning ? 0.72 : 1, rotateZ: returning ? 18 : 0 }}
            exit={{ opacity: 0, scale: 0.8 }}
            transition={reducedMotion ? instant : { duration: 0.18 }}
          >
            <X size={20} />
          </motion.button>

          <div
            className="picked-wrap"
          >
            <motion.div
              className="picked-card"
              initial={reducedMotion ? false : { opacity: 0, scale: 0.74, y: 58, rotateZ: -3 }}
              animate={returning
                ? { opacity: 1, scale: 0.64, y: 74, rotateZ: -2 }
                : { opacity: 1, scale: 1, y: 0, rotateZ: 0 }}
              exit={{
                opacity: 0,
                scale: 0.62,
                y: 76,
                rotateZ: -2,
                transition: reducedMotion ? instant : { duration: 0.16, ease: "easeOut" }
              }}
              transition={reducedMotion ? instant : returning
                ? { type: "spring", stiffness: 230, damping: 25, mass: 0.9 }
                : { type: "spring", stiffness: 265, damping: 24, mass: 0.86 }}
            >
              <motion.div
                className="card-shell"
                initial={reducedMotion ? false : { rotateY: 0 }}
                animate={{ rotateY: returning ? 0 : 180 }}
                exit={{ rotateY: 0 }}
                transition={reducedMotion ? instant : returning
                  ? { type: "spring", stiffness: 240, damping: 26 }
                  : { type: "spring", stiffness: 210, damping: 24, delay: 0.13 }}
              >
                <CardBack />
                <ProjectReveal project={project} />
              </motion.div>
            </motion.div>
          </div>
        </div>
      );
    }

    function PortfolioTable() {
      const reducedMotion = useReducedMotion();
      const [dealt, setDealt] = useState(false);
      const [hasOpened, setHasOpened] = useState(false);
      const [highlightedId, setHighlightedId] = useState(null);
      const [selected, setSelected] = useState(null);
      const [returning, setReturning] = useState(false);
      const [viewportWidth, setViewportWidth] = useState(() => window.innerWidth);
      const compact = viewportWidth < 760;
      const [touchMode, setTouchMode] = useState(() => window.matchMedia("(hover: none), (pointer: coarse)").matches);
      const [announcement, setAnnouncement] = useState("Project deck ready");
      const returnTimerRef = useRef(null);

      useEffect(() => {
        const pointerQuery = window.matchMedia("(hover: none), (pointer: coarse)");
        const onResize = () => setViewportWidth(window.innerWidth);
        const onPointerChange = () => setTouchMode(pointerQuery.matches);
        window.addEventListener("resize", onResize);
        pointerQuery.addEventListener?.("change", onPointerChange);
        return () => {
          window.removeEventListener("resize", onResize);
          pointerQuery.removeEventListener?.("change", onPointerChange);
        };
      }, []);

      useEffect(() => () => clearTimeout(returnTimerRef.current), []);

      const dealDeck = useCallback(() => {
        setHasOpened(true);
        setDealt(true);
        setHighlightedId(null);
        setAnnouncement("Deck open. Choose any project card.");
      }, []);

      const pickUp = useCallback((project, revealDirectly = false) => {
        if (!revealDirectly && (touchMode || compact) && highlightedId !== project.id) {
          setHighlightedId(project.id);
          setAnnouncement(`${project.title} drawn forward. Tap again to reveal it.`);
          return;
        }

        setDealt(false);
        setReturning(false);
        setSelected(project);
        setAnnouncement(`${project.title} revealed`);
      }, [compact, highlightedId, touchMode]);

      const putBack = useCallback(() => {
        if (returning) return;
        setReturning(true);
        setAnnouncement("Project returning to the deck.");
        clearTimeout(returnTimerRef.current);
        returnTimerRef.current = setTimeout(() => {
          setSelected(null);
          setHighlightedId(null);
          setReturning(false);
          setAnnouncement("Project returned to the deck. Open it again to choose another card.");
          requestAnimationFrame(() => document.querySelector(".deck-pile")?.focus());
        }, reducedMotion ? 20 : 720);
      }, [reducedMotion, returning]);

      useEffect(() => {
        const onKeyDown = (event) => {
          if (!selected) return;
          if (event.key === "Escape") putBack();
          if (event.key !== "Tab") return;
          const dialog = document.querySelector("[data-project-dialog]");
          const controls = dialog?.querySelectorAll('button:not(:disabled):not([tabindex="-1"]), a[href]');
          if (!controls?.length) return;
          const first = controls[0];
          const last = controls[controls.length - 1];
          if (!dialog.contains(document.activeElement) || document.activeElement === (event.shiftKey ? first : last)) {
            event.preventDefault();
            (event.shiftKey ? last : first).focus();
          }
        };

        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
      }, [putBack, selected]);

      return (
        <main className="table-surface">
          <div aria-live="polite" className="sr-only">{announcement}</div>

          <header className="absolute left-7 top-7 z-30 flex items-center gap-3 md:left-10 md:top-10">
            <div className="brand-mark grid h-12 w-12 place-items-center rounded-2xl text-[#d3b36a]">
              <Layers3 size={22} />
            </div>
            <div>
              <h1 className="text-lg font-bold leading-none tracking-tight text-[#f5edda] md:text-xl">Jared in Tech</h1>
              <p className="font-mono mt-1.5 text-[9px] uppercase tracking-[0.24em] text-[#d8cdaecc]">
                Portfolio / 2026 edition
              </p>
            </div>
          </header>

          <aside className="table-note desktop-note bottom-[11%] right-[7%] z-10" aria-label="How to use this portfolio">
            <p className="font-card mb-2 text-[27px] font-bold leading-none">Pick a card.</p>
            <p className="font-mono text-[9px] uppercase leading-[1.75] tracking-[0.13em]">
              Open the deck, choose the card that catches your eye, then lift it to reveal the project.
            </p>
          </aside>

          <section className="flex min-h-[100svh] flex-col items-center justify-center px-4 pb-20 pt-28 md:px-8 md:pb-14 md:pt-24">
            <div className="relative z-10 mb-0 text-center md:mb-[-18px]">
              <p className="font-mono mb-3 text-[9px] uppercase tracking-[0.32em] text-[#d3b36a]">Selected works</p>
              <h2 className="font-card text-[52px] font-bold leading-[0.82] tracking-[-0.06em] text-[#f5edda] md:text-[76px]">
                Pick a card.
                <span className="block text-[#d7c798]">Any card.</span>
              </h2>
            </div>

            <div className="stage" aria-label="Project card table">
              <AnimatePresence>
                {!dealt && <DealPile key="deal-pile" onDeal={dealDeck} reducedMotion={reducedMotion} hasOpened={hasOpened} />}
              </AnimatePresence>

              <AnimatePresence>
                {dealt && projects.map((project, index) => {
                  return (
                    <FanCard
                      key={project.id}
                      project={project}
                      index={index}
                      count={projects.length}
                      current={highlightedId === project.id}
                      compact={compact}
                      viewportWidth={viewportWidth}
                      touchMode={touchMode}
                      onPick={pickUp}
                      onMakeCurrent={() => setHighlightedId(project.id)}
                      onClearCurrent={() => !touchMode && !compact && setHighlightedId(null)}
                      reducedMotion={reducedMotion}
                    />
                  );
                })}
              </AnimatePresence>
            </div>

            {dealt && (
              <ul className="project-picker" aria-label="Choose a project by name">
                {projects.map((project) => (
                  <li key={project.id}>
                    <button type="button" onClick={() => pickUp(project, true)}>{project.title}</button>
                  </li>
                ))}
              </ul>
            )}
            <div className="relative z-20 mt-4">
              {dealt ? (
                <>
                  <p className="font-mono mobile-hint mt-4 text-center text-[8px] uppercase tracking-[0.2em] text-[#d8cdae99]">
                    Tap a card to draw it forward. Tap again to reveal.
                  </p>
                  <p className="font-mono desktop-note mt-4 text-center text-[8px] uppercase tracking-[0.2em] text-[#d8cdae99]">
                    Hover over any card. Click or pull upward to reveal.
                  </p>
                </>
              ) : (
                <p className="font-mono text-center text-[8px] uppercase tracking-[0.2em] text-[#d8cdae99]">
                  {projects.length} projects are waiting on the table
                </p>
              )}
            </div>
          </section>

          <footer className="absolute bottom-7 left-7 z-20 md:bottom-10 md:left-10">
            <a
              className="font-mono inline-flex items-center gap-2 text-[9px] uppercase tracking-[0.2em] text-[#d8cdaecc] transition-colors duration-200 hover:text-[#f5edda] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#f2d88f]"
              href="https://github.com/jaredando"
              target="_blank"
              rel="noreferrer"
            >
              <Github size={14} />
              github.com/jaredando
            </a>
          </footer>

          <AnimatePresence>
            {selected && (
              <PickedCard
                key={selected.id}
                project={selected}
                onClose={putBack}
                reducedMotion={reducedMotion}
                returning={returning}
              />
            )}
          </AnimatePresence>
        </main>
      );
    }

    createRoot(document.getElementById("root")).render(<PortfolioTable />);
  </script>
</body>
</html>
