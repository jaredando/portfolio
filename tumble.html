<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Tumble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-top:#EDF1F6; --bg-bottom:#D9E1EB; --floor:#C9D3DF; --track:#8EAEE0;
  --line:rgba(255,255,255,.55); --edge:rgba(255,255,255,.9);
  --ink:#13203B; --ink-soft:rgba(19,32,59,.6); --accent:#D41F6A;
  --shadow:rgba(19,32,59,.24); --glow:rgba(255,255,255,.85); --glow0:rgba(255,255,255,0);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg-top:#081127; --bg-bottom:#12224A; --floor:#0B1631; --track:#2A54B0;
    --line:rgba(255,255,255,.16); --edge:rgba(255,255,255,.4);
    --ink:#F3F6FC; --ink-soft:rgba(243,246,252,.62); --accent:#FF4F98;
    --shadow:rgba(0,0,0,.45); --glow:rgba(120,160,255,.18); --glow0:rgba(120,160,255,0);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-top:#081127; --bg-bottom:#12224A; --floor:#0B1631; --track:#2A54B0;
  --line:rgba(255,255,255,.16); --edge:rgba(255,255,255,.4);
  --ink:#F3F6FC; --ink-soft:rgba(243,246,252,.62); --accent:#FF4F98;
  --shadow:rgba(0,0,0,.45); --glow:rgba(120,160,255,.18); --glow0:rgba(120,160,255,0);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  background:var(--bg-bottom);color:var(--ink);
  font-family:"Archivo",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;
}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;}

.hud{position:fixed;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 20px);display:flex;flex-direction:column;align-items:center;pointer-events:none;transition:opacity .4s ease;}
.hud.hidden{opacity:0;}
.scorewrap{position:relative;}
.score{font-stretch:75%;font-variation-settings:"wdth" 75;font-weight:600;font-size:clamp(46px,13vw,68px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.mult{position:absolute;left:100%;top:3px;margin-left:8px;font-weight:700;font-size:clamp(17px,4.8vw,22px);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap;opacity:0;transform-origin:left center;transition:opacity .3s ease;}
.mult.on{opacity:1;}
.mult.bump{animation:bump .45s cubic-bezier(.2,.7,.2,1);}
@keyframes bump{0%{transform:scale(1.7)}100%{transform:scale(1)}}
.pass{margin-top:12px;display:flex;gap:5px;height:3px;}
.pass i{display:block;width:12px;height:3px;border-radius:3px;background:var(--shadow);transition:background-color .25s ease;}
.pass i.final{width:24px;}
.pass i.saved{background:var(--ink-soft);}
.pass i.clean{background:var(--ink);}
.pass i.stuck{background:var(--accent);}
.pass i.now{animation:blink .8s ease-in-out infinite;background:var(--ink-soft);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.callout{margin-top:20px;text-align:center;opacity:0;}
.callout.show{animation:pop 1.3s cubic-bezier(.2,.7,.2,1) forwards;}
.skill{font-weight:700;font-size:clamp(26px,7.4vw,42px);line-height:1.05;letter-spacing:-.02em;}
.quality{margin-top:8px;display:flex;justify-content:center;gap:14px;font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.quality span:empty,.quality b:empty{display:none;}
.quality b{font-weight:600;color:var(--ink);}
.callout[data-q="Stuck"] .quality b,.callout[data-q="Stuck it"] .quality b{color:var(--accent);}
@keyframes pop{0%{opacity:0;transform:translateY(10px)}12%{opacity:1;transform:translateY(0)}72%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

.hint{position:fixed;left:0;right:0;bottom:0;padding:0 24px calc(env(safe-area-inset-bottom,0px) + 32px);text-align:center;font-size:14px;line-height:1.5;color:var(--ink-soft);pointer-events:none;opacity:0;transition:opacity .5s ease;}
.hint.show{opacity:1;}
.hint b{font-weight:600;color:var(--ink);font-size:16px;}

.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 11vh) 28px 0;text-align:center;pointer-events:none;transition:opacity .5s ease,transform .5s ease;}
.overlay.hidden{opacity:0;transform:translateY(-10px);}
.wordmark{font-stretch:125%;font-variation-settings:"wdth" 125;font-weight:800;font-size:clamp(58px,17vw,104px);letter-spacing:-.045em;line-height:.95;margin:0;}
.lede{margin:18px 0 0;font-size:clamp(16px,4.4vw,20px);line-height:1.45;color:var(--ink-soft);max-width:22em;}
.tap{margin-top:30px;font-size:15px;font-weight:600;animation:breathe 2.4s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.4}50%{opacity:1}}
.best{margin-top:8px;font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.label{font-size:16px;color:var(--ink-soft);}
.big{font-stretch:75%;font-variation-settings:"wdth" 75;font-weight:600;font-size:clamp(84px,24vw,128px);line-height:1;letter-spacing:-.02em;margin:6px 0 10px;font-variant-numeric:tabular-nums;}
.detail{font-size:15px;line-height:1.65;color:var(--ink-soft);}
.detail strong{color:var(--ink);font-weight:600;}

.sound{position:fixed;top:0;right:0;margin:0;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 16px 16px;background:none;border:0;color:var(--ink-soft);cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent;}
.sound svg{display:block;}
.sound.off .w{opacity:0;}
.sound.off .x{opacity:1;}
.sound .x{opacity:0;}
.sound:focus-visible{outline:2px solid var(--accent);outline-offset:-8px;border-radius:14px;}
@media (prefers-reduced-motion:reduce){.tap,.pass i.now{animation:none;opacity:.85}}
.portfolio-return{position:fixed;top:env(safe-area-inset-top,0px);left:12px;z-index:10;display:inline-flex;align-items:center;min-height:44px;padding:0 8px;color:var(--ink);font-size:14px;text-underline-offset:4px}
.portfolio-return:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<a class="portfolio-return" href="index.html">Back to portfolio</a>

<canvas id="c" aria-label="Tumble: hold to tuck, release to open, land on your feet"></canvas>

<div class="hud hidden" id="hud">
  <div class="scorewrap"><div class="score" id="score">0</div><div class="mult" id="mult" aria-hidden="true"></div></div>
  <div class="pass" id="pass" aria-hidden="true"></div>
  <div class="callout" id="callout" aria-live="polite">
    <div class="skill" id="skill"></div>
    <div class="quality"><b id="qWord"></b><span id="qPts"></span><span id="qStreak"></span></div>
  </div>
</div>

<div class="hint" id="hint" aria-live="polite"></div>

<div class="overlay" id="menu">
  <h1 class="wordmark">tumble</h1>
  <p class="lede">Hold to tuck. Let go to open.<br>Land it by feel.</p>
  <div class="tap">Tap to start</div>
  <div class="best" id="bestMenu"></div>
</div>

<div class="overlay hidden" id="over">
  <div class="label" id="finalLabel">Pass ended</div>
  <div class="big" id="finalScore">0</div>
  <div class="detail" id="finalDetail"></div>
  <div class="tap">Tap to go again</div>
</div>

<button class="sound" id="snd" type="button" aria-label="Mute sound">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/>
    <path class="w" d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/>
    <path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/>
  </svg>
</button>

<script>
(() => {
'use strict';

/* ---------- Config ---------- */
const TAU = Math.PI * 2;
const G = 9.8;                         // gravity (m/s^2)
const H0 = 0.92;                       // standing centre-of-mass height (m)
const OMEGA0 = 4.2;                    // open-body spin (rad/s)
const I_TUCK = 0.4;                    // tucked moment of inertia relative to open (2.5x spin)
const K_TUCK = 1 - I_TUCK;
const OMEGA_T = OMEGA0 / I_TUCK;
const TUCK_RATE = 16;                  // how fast the body follows the thumb (1/s)
const TOL_STUCK = 8, TOL_CLEAN = 22, TOL_SAVE = 44;   // landing windows (degrees)
const CLEAN_R = TOL_CLEAN / 360, SAVE_R = TOL_SAVE / 360;
const T_MIN = 0.9, T_SPAN = 1.05;      // flight time (s) across momentum 0..1: a single is always on, a triple only at full momentum
const START_POWER = 0.15;              // momentum at the start of every pass
const GAIN = { Stuck: 0.15, Clean: 0.08, Saved: -0.15 };
const START_BONUS = { Perfect: 0.2, Good: 0.1 };
const START_PERFECT = 0.045, START_GOOD = 0.1, START_OPEN = 0.4;   // tap window around the line (game s)
const PASS_LEN = [4, 5, 6, 7, 8];      // skills per pass, 8 from pass 5 on
const TEMPO_BASE = 0.8, TEMPO_PASS = 0.075, TEMPO_SKILL = 0.02, TEMPO_MAX = 2;
const VAR_BASE = 0.04, VAR_PASS = 0.02, VAR_MAX = 0.14;           // rebound unpredictability
const BASE_PTS = [0, 10, 30, 80, 180, 400];
const STYLE_X = { Layout: 2, Pike: 1.4, Tuck: 1 };
const QUAL_X = { Stuck: 1.5, Clean: 1, Saved: 0.5 };
const FINAL_X = { Stuck: 3, Clean: 2, Saved: 1 };
const MULT_EVERY = 3, MULT_MAX = 5;
const RUN_DUR = 0.95, RO_DUR = 0.5, LAND_DUR = 0.16, SAVED_DUR = 0.26, STICK_DUR = 1.05, FALL_DUR = 0.42, TRAIL_LIFE = 0.34;
const SPOT_R = 0.5, RING_GROW = 0.4;   // landing ring radius (m); it grows 40% for each extra rotation
const RING_NAMES = ['', 'single', 'double', 'triple', 'quad'];
const CAM_BACK = 5.6, CAM_BACK_MENU = 4.8, PITCH = 0.14;
const CA = Math.cos(PITCH), SA = Math.sin(PITCH), TA = Math.tan(PITCH);
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

// One goal at a time, roughly in order of difficulty
const GOALS = [
  ['Finish a pass', r => r.passes >= 1],
  ['Stick a landing', r => r.stuck >= 1],
  ['Reach ×2', r => r.maxMult >= 2, 'Land 3 in a row, all clean or stuck.'],
  ['Get a perfect start', r => r.perfectStarts >= 1, 'Tap as you cross the line.'],
  ['Land a double', r => r.doubles >= 1, 'A dashed ring means a double is on. Hold longer.'],
  ['Finish pass 2', r => r.passes >= 2],
  ['Stick the last landing of a pass', r => r.stuckFinals >= 1],
  ['Land a layout', r => r.layouts >= 1, 'On a big bounce, if the circles already meet, don’t tuck.'],
  ['Reach ×3', r => r.maxMult >= 3],
  ['Finish pass 3', r => r.passes >= 3],
  ['Stick 3 landings in a row', r => r.maxStuckRow >= 3],
  ['Land 2 doubles in one pass', r => r.maxPassDoubles >= 2],
  ['Score 1,000 in one run', r => r.score >= 1000],
  ['Finish pass 4', r => r.passes >= 4],
  ['Reach ×4', r => r.maxMult >= 4],
  ['Score 2,000 in one run', r => r.score >= 2000],
  ['Finish pass 5', r => r.passes >= 5],
  ['Land a triple', r => r.triples >= 1, 'Build momentum, then hold on almost to the floor.'],
  ['Score 3,000 in one run', r => r.score >= 3000],
  ['Reach ×5', r => r.maxMult >= 5],
  ['Stick 5 landings in a row', r => r.maxStuckRow >= 5],
  ['Finish pass 7', r => r.passes >= 7],
  ['Score 6,000 in one run', r => r.score >= 6000],
  ['Stick every landing in a pass', r => r.perfectPasses >= 1],
  ['Finish pass 10', r => r.passes >= 10],
  ['Score 15,000 in one run', r => r.score >= 15000]
];

/* ---------- Helpers ---------- */
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const ease = k => 0.5 - 0.5 * Math.cos(Math.PI * clamp(k, 0, 1));
const approach = (rate, dt) => 1 - Math.exp(-rate * dt);
const $ = id => document.getElementById(id);
const nf = (window.Intl && Intl.NumberFormat) ? new Intl.NumberFormat('en-US') : null;
const fmt = n => (nf ? nf.format(n) : String(n));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

// Distance covered by the run-up, so the roundoff always starts on the line
const RUN_DIST = (() => {
  let z = 0;
  for (let i = 0; i < 2000; i++) z += lerp(1.6, 6.4, ease((i + 0.5) / 2000 * 1.15)) * RUN_DUR / 2000;
  return z;
})();

/* ---------- Spin model (exact, so the spotting circles never lie) ---------- */
// Rotation (rad) over h seconds holding the tuck, starting from tuck tk
function spinHold(tk, h) {
  if (h <= 0) return 0;
  const b = K_TUCK * (1 - tk);
  return OMEGA_T * (h + Math.log((I_TUCK + b * Math.exp(-TUCK_RATE * h)) / (I_TUCK + b)) / TUCK_RATE);
}
// Rotation (rad) over h seconds after letting go at tuck tk
function spinOpen(tk, h) {
  if (h <= 0) return 0;
  const a = K_TUCK * tk;
  return OMEGA0 * (h + Math.log((1 - a * Math.exp(-TUCK_RATE * h)) / (1 - a)) / TUCK_RATE);
}

/* ---------- Persistence ---------- */
function loadProfile() {
  let p = null;
  try { p = JSON.parse(store.get('tumble.v3') || 'null'); } catch (e) { p = null; }
  if (!p || typeof p !== 'object') p = {};
  const oldBest = parseInt(store.get('tumble.best') || '0', 10) || 0;
  return {
    best: Math.max(oldBest, p.best | 0),
    bestPass: p.bestPass | 0,
    goal: clamp(p.goal | 0, 0, GOALS.length),
    runs: p.runs | 0,
    landed: p.landed | 0,
    seen: (p.seen && typeof p.seen === 'object') ? p.seen : {}
  };
}
let profile = loadProfile();
function saveProfile() { store.set('tumble.v3', JSON.stringify(profile)); }

const cvs = $('c'), ctx = cvs.getContext('2d');
const hud = $('hud'), scoreEl = $('score'), multEl = $('mult'), passEl = $('pass'), calloutEl = $('callout'),
  skillEl = $('skill'), qWord = $('qWord'), qPts = $('qPts'), qStreak = $('qStreak'),
  hintEl = $('hint'), menuEl = $('menu'), overEl = $('over'), bestMenu = $('bestMenu'),
  finalLabel = $('finalLabel'), finalScore = $('finalScore'), finalDetail = $('finalDetail'), sndBtn = $('snd');

/* ---------- Viewport + theme ---------- */
let W = 0, H = 0, F = 1, CY = 0, DPR = 1;
const C = {};
const TOKENS = ['bg-top', 'bg-bottom', 'floor', 'track', 'line', 'edge', 'ink', 'ink-soft', 'accent', 'shadow', 'glow', 'glow0'];
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of TOKENS) C[k] = cs.getPropertyValue('--' + k).trim();
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  F = Math.min(0.7 * H, 1.6 * W);
  CY = 0.56 * H;
  readColors();
}

/* ---------- Body poses (local frame: x right, y up, z facing) ----------
   joints: 0 head, 1 neck, 2 hip, 3 kneeL, 4 footL, 5 kneeR, 6 footR, 7 elbowL, 8 handL, 9 elbowR, 10 handR */
const P = {
  stand:  [[0,.78,0],[0,.55,0],[0,0,0],[-.11,-.45,.02],[-.11,-.9,0],[.11,-.45,.02],[.11,-.9,0],[-.2,.28,-.02],[-.22,.03,.02],[.2,.28,-.02],[.22,.03,.02]],
  open:   [[0,.77,0],[0,.55,0],[0,0,0],[-.08,-.45,0],[-.06,-.92,0],[.08,-.45,0],[.06,-.92,0],[-.17,.85,0],[-.13,1.14,0],[.17,.85,0],[.13,1.14,0]],
  tuck:   [[0,.4,.07],[0,.22,-.05],[0,-.18,-.22],[-.12,.12,.24],[-.1,-.3,.17],[.12,.12,.24],[.1,-.3,.17],[-.22,.1,.12],[-.14,-.06,.26],[.22,.1,.12],[.14,-.06,.26]],
  crouch: [[0,.68,.2],[0,.48,.14],[0,0,-.08],[-.12,-.28,.22],[-.12,-.64,0],[.12,-.28,.22],[.12,-.64,0],[-.2,.42,.28],[-.18,.62,.42],[.2,.42,.28],[.18,.62,.42]],
  wheel:  [[0,.77,0],[0,.55,0],[0,0,0],[-.2,-.42,0],[-.36,-.84,0],[.2,-.42,0],[.36,-.84,0],[-.24,.82,0],[-.3,1.1,0],[.24,.82,0],[.3,1.1,0]]
};
function lerpPose(A, B, t) {
  const o = new Array(A.length);
  for (let i = 0; i < A.length; i++) {
    const a = A[i], b = B[i];
    o[i] = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  return o;
}
function runPose(p) {
  const o = [[0,.79,.08],[0,.56,.06],[0,0,0]];
  for (const [side, ph] of [[-1, p], [1, p + Math.PI]]) {
    const s = Math.sin(ph), c = Math.cos(ph);
    const a = 0.7 * s, bend = 0.3 + 1.1 * Math.max(0, -c);
    const kz = 0.45 * Math.sin(a), ky = -0.45 * Math.cos(a), b = a - bend;
    o.push([side * .11, ky, kz], [side * .11, ky - 0.47 * Math.cos(b), kz + 0.47 * Math.sin(b)]);
  }
  for (const [side, ph] of [[-1, p + Math.PI], [1, p]]) {
    const a = 0.8 * Math.sin(ph), ez = 0.06 + 0.3 * Math.sin(a), ey = 0.55 - 0.3 * Math.cos(a), b = a + 1.3;
    o.push([side * .2, ey, ez], [side * .22, ey - 0.27 * Math.cos(b), ez + 0.27 * Math.sin(b)]);
  }
  return o;
}

/* ---------- State ---------- */
const S = {};
const cam = { x: 0.85, y: 1.85, z: -CAM_BACK_MENU };
const pointers = new Set(), trail = [], ripples = [];
let holding = false, holdAt = -1, frameTo = 0, clock = 0, shake = 0, shiftX = 0, overAt = 0, freeze = 0;
let toastHtml = '', toastUntil = 0, lineHtml = '';   // bottom line: hints, goals and "new best"
let R = newRun();

function newRun() {
  return {
    score: 0, passes: 0, stuck: 0, stuckRow: 0, maxStuckRow: 0, maxMult: 1,
    doubles: 0, triples: 0, layouts: 0, stuckFinals: 0, passDoubles: 0, maxPassDoubles: 0,
    perfectPasses: 0, perfectStarts: 0, topSkill: '', topRank: -1, beatBest: false, goalDone: ''
  };
}
function reset() {
  Object.assign(S, {
    mode: 'menu', t: 0, x: 0, y: H0, z: 0, vy: 0, vz: 0, yaw: 0, roll: 0, wob: 0,
    theta: 0, thetaStart: 0, thetaTarget: 0, landFrom: 0, fallFrom: 0, fallTo: 0,
    tuck: 0, tuckSum: 0, airT: 0, flightT: 1, omega: OMEGA0, power: START_POWER, tempo: TEMPO_BASE,
    pass: 1, passLen: PASS_LEN[0], skill: 0, final: false, allStuck: true, streak: 0, mult: 1,
    target: 1, spotD: -1, pm: 0, extra: false, held: false, pressedAir: false, pmRel: Infinity, hinted: false, ringR: SPOT_R,
    reason: '', nearMiss: false, runFrom: 0, punchZ: RUN_DIST, startJudged: false, lineFlash: -9,
    runPhase: 0, glow: 0, landZ: 0, impacted: false, impactAt: 0, landQ: '',
    pose: P.stand, landPoseFrom: P.stand, roFrom: P.stand
  });
}

function toWorld(j) {
  const th = -S.theta, ct = Math.cos(th), st = Math.sin(th);
  const x0 = j[0], y1 = j[1] * ct - j[2] * st, z1 = j[1] * st + j[2] * ct;
  const cr = Math.cos(S.roll), sr = Math.sin(S.roll);
  const x2 = x0 * cr - y1 * sr, y2 = x0 * sr + y1 * cr;
  const cy = Math.cos(S.yaw), sy = Math.sin(S.yaw);
  return [S.x + x2 * cy + z1 * sy, S.y + y2, S.z - x2 * sy + z1 * cy];
}
function proj(p) {
  const rx = p[0] - cam.x, ry = p[1] - cam.y, rz = p[2] - cam.z;
  const y1 = ry * CA + rz * SA, z1 = -ry * SA + rz * CA;
  if (z1 < 0.08) return null;
  return [W / 2 + shiftX + F * rx / z1, CY - F * y1 / z1, z1];
}

/* ---------- Audio ---------- */
let AC = null, master = null, airNode = null, noiseBuf = null;
let soundOn = store.get('tumble.sound') !== '0';
function ensureAudio() {
  if (!AC) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    try { AC = new Ctor(); } catch (e) { AC = null; return; }
    master = AC.createGain(); master.gain.value = soundOn ? 0.9 : 0; master.connect(AC.destination);

    if (n > S.target && S.pressedAir) tick();

    }

    case 'stick': {                          // the last landing of a pass: absorb, salute, turn for the next run
      const t = S.t;
      S.theta = lerp(S.landFrom, S.thetaTarget, ease(t / 0.08));
      if (t < 0.16) { const k = t / 0.16; S.pose = lerpPose(S.landPoseFrom, P.crouch, ease(k)); S.y = H0 - 0.3 * Math.sin(Math.PI / 2 * k); }
      else if (t < 0.44) { const k = (t - 0.16) / 0.28; S.pose = lerpPose(P.crouch, P.open, ease(k)); S.y = H0 - 0.3 * (1 - ease(k)); }
      else if (t < 0.8) { S.pose = P.open; S.y = H0; }
      else {
        const k = clamp((t - 0.8) / (STICK_DUR - 0.8), 0, 1);
        S.pose = lerpPose(P.open, P.stand, ease(k)); S.y = H0; S.yaw = Math.PI * (1 + ease(k));
      }
      S.tuck *= Math.exp(-dt * 20);
      S.glow *= Math.exp(-dt * 10);
      S.vz *= Math.exp(-dt * 10); S.z += S.vz * dt;
      if (t >= STICK_DUR) startPass(S.pass + 1);
      break;
    }

    case 'fall': {
      const k = clamp(S.t / FALL_DUR, 0, 1), e = k * k;
      S.theta = lerp(S.fallFrom, S.fallTo, e);
      S.y = lerp(H0, 0.15, e);
      S.vz *= Math.exp(-dt * 3); S.z += S.vz * dt;
      S.pose = lerpPose(S.landPoseFrom, P.stand, ease(k));
      S.tuck *= Math.exp(-dt * 12);
      S.glow *= Math.exp(-dt * 10);
      if (k >= 1 && !S.impacted) { S.impacted = true; S.impactAt = clock; impact(); }
      if (S.impacted && clock - S.impactAt > 0.55) gameOver();
      break;
    }

    case 'over':
      S.vz *= Math.exp(-dt * 3); S.z += S.vz * dt;
      break;
  }

  const back = S.mode === 'menu' ? CAM_BACK_MENU : CAM_BACK;
  cam.z += ((S.z - back) - cam.z) * approach(S.mode === 'run' ? 1.6 : 2.8, dt);
  cam.y += ((1.85 + 0.5 * Math.max(0, S.y - H0)) - cam.y) * approach(3.2, dt);
  {
    const rx = S.x - cam.x, ry = H0 - cam.y, rz = S.z - cam.z;
    shiftX = -F * rx / Math.max(0.5, -ry * SA + rz * CA);
  }
  shake *= Math.exp(-dt * 9);
}

/* ---------- Rendering ---------- */
function floorPath(x, z, r) {
  ctx.beginPath();
  for (let i = 0; i <= 32; i++) {
    const a = i / 32 * TAU, p = proj([x + Math.cos(a) * r, 0, z + Math.sin(a) * r]);
    if (!p) return false;
    if (i) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]);
  }
  ctx.closePath();
  return true;
}
function seg(p, q) { ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke(); }
function poly(...p) {
  ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
  for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
  ctx.stroke();
}

function drawTrack(hz) {
  const hw = 0.95, zn = cam.z + 0.7, zf = cam.z + 160;
  const a = proj([-hw, 0, zn]), b = proj([hw, 0, zn]), c = proj([hw, 0, zf]), d = proj([-hw, 0, zf]);
  if (!a || !b || !c || !d) return;
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.closePath();
  const g = ctx.createLinearGradient(0, hz, 0, H);
  g.addColorStop(0, C['bg-bottom']); g.addColorStop(0.22, C['track']); g.addColorStop(1, C['track']);
  ctx.fillStyle = g; ctx.fill();

  ctx.lineWidth = 1; ctx.strokeStyle = C['line'];
  for (let z = Math.ceil(zn / 2) * 2; z < cam.z + 70; z += 2) {
    const p = proj([-hw, 0, z]), q = proj([hw, 0, z]);
    if (!p || !q) continue;
    ctx.globalAlpha = Math.pow(clamp(1 - (z - cam.z) / 70, 0, 1), 1.4);
    seg(p, q);
  }

  const zs = [zn, cam.z + 4, cam.z + 8, cam.z + 14, cam.z + 22, cam.z + 34, cam.z + 50, cam.z + 75, cam.z + 110, zf];
  ctx.strokeStyle = C['edge']; ctx.lineWidth = 1.25;
  for (let i = 0; i < zs.length - 1; i++) {
    const al = 1 - i / (zs.length - 1); ctx.globalAlpha = al * al;
    for (const sx of [-hw, hw]) {
      const p = proj([sx, 0, zs[i]]), q = proj([sx, 0, zs[i + 1]]);
      if (p && q) seg(p, q);
    }
  }

  // The hurdle line: tap as you cross it
  const lineA = S.mode === 'run' ? 0.9 : S.mode === 'roundoff' ? 0.9 * clamp(1 - S.t / 0.3, 0, 1) : 0;
  if (lineA > 0 && S.punchZ > zn) {
    const m1 = proj([-hw, 0, S.punchZ]), m2 = proj([hw, 0, S.punchZ]);
    if (m1 && m2) {
      const fl = clamp(1 - (clock - S.lineFlash) / 0.35, 0, 1);
      ctx.globalAlpha = lineA; ctx.strokeStyle = C['accent']; ctx.lineWidth = 2.5 + 3 * fl; seg(m1, m2);
    }
  }
  ctx.globalAlpha = 1;
}

function drawRipples() {
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i], k = (clock - r.t) / 0.65;
    if (k < 0) continue;
    if (k >= 1) { ripples.splice(i, 1); continue; }
    const e = 1 - Math.pow(1 - k, 3);
    ctx.strokeStyle = r.acc ? C['accent'] : C['ink'];
    if (floorPath(r.x, r.z, 0.25 + 1.0 * e)) {
      ctx.globalAlpha = (1 - k) * (r.acc ? 0.85 : 0.35); ctx.lineWidth = r.acc ? 1.8 : 1.2; ctx.stroke();
    }
    if (r.acc && floorPath(r.x, r.z, 0.2 + 0.6 * e)) { ctx.globalAlpha = (1 - k) * 0.45; ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
}

function drawShadowAndSpot() {
  const h = Math.max(0, S.y - H0);
  const lying = S.mode === 'fall' || S.mode === 'over';
  const r = (lying ? 0.55 : 0.3) / (1 + 0.45 * h);
  if (floorPath(S.x, S.z, r)) { ctx.globalAlpha = 1 / (1 + 0.6 * h); ctx.fillStyle = C['shadow']; ctx.fill(); }
  if (S.mode === 'air') {
    // Landing ring: bigger for each extra rotation you're going for. A dashed ring outside it means one more is on.
    const g = S.glow;
    S.ringR += (SPOT_R * (1 + RING_GROW * (S.target - 1)) - S.ringR) * 0.35;
    const rr = S.ringR, nextR = SPOT_R * (1 + RING_GROW * S.target);
    if (S.extra && floorPath(S.x, S.landZ, nextR)) {
      ctx.globalAlpha = 0.3; ctx.strokeStyle = C['ink']; ctx.lineWidth = 1.3;
      ctx.setLineDash([4, 6]); ctx.stroke(); ctx.setLineDash([]);
    }
    if (floorPath(S.x, S.landZ, rr)) {
      if (g > 0.01) { ctx.globalAlpha = 0.18 * g; ctx.fillStyle = C['accent']; ctx.fill(); }
      ctx.globalAlpha = S.final ? 0.5 : 0.32; ctx.strokeStyle = C['ink']; ctx.lineWidth = S.final ? 2.2 : 1.5; ctx.stroke();
      if (g > 0.01) { ctx.globalAlpha = 0.95 * g; ctx.strokeStyle = C['accent']; ctx.lineWidth = 2.2; ctx.stroke(); }
    }
    // Name the bigger skill: on the dashed ring when it's on offer, on the ring once you're going for it
    const name = S.extra ? RING_NAMES[Math.min(S.target + 1, 4)] : S.target > 1 ? RING_NAMES[Math.min(S.target, 4)] : '';
    if (name) {
      const p = proj([S.x + (S.extra ? nextR : rr), 0, S.landZ]);
      if (p) {
        ctx.globalAlpha = S.extra ? 0.5 : 0.8; ctx.fillStyle = C['ink'];
        ctx.font = '600 13px Archivo, ui-sans-serif, system-ui, sans-serif'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
        ctx.fillText(name, p[0] + 8, p[1]);
      }
    }
    // Approach circle: closes in only while you hold. Let go when it meets the ring.
    const ar = clamp(rr - 1.5 * SPOT_R * S.spotD, 0.55 * rr, 2.4 * rr);   // same closing speed whatever the target
    if (floorPath(S.x, S.landZ, ar)) {
      ctx.lineWidth = 1.8;
      ctx.globalAlpha = 0.6 * (1 - g); ctx.strokeStyle = C['ink']; ctx.stroke();
      ctx.globalAlpha = g; ctx.strokeStyle = C['accent']; ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

function drawTrail() {
  while (trail.length && clock - trail[0].t > TRAIL_LIFE) trail.shift();
  if (trail.length < 2) return;
  ctx.lineCap = 'round'; ctx.strokeStyle = C['accent'];
  let prev = proj(trail[0].p);
  for (let i = 1; i < trail.length; i++) {
    const cur = proj(trail[i].p);
    if (prev && cur) {
      const a = 1 - (clock - trail[i].t) / TRAIL_LIFE;
      ctx.globalAlpha = a * a * 0.6;
      ctx.lineWidth = Math.max(1, F * 0.035 / cur[2] * a + 0.5);
      seg(prev, cur);
    }
    prev = cur;
  }
  ctx.globalAlpha = 1;
}

function drawFigure() {
  const pts = S.pose.map(j => proj(toWorld(j)));
  for (const p of pts) if (!p) return;
  const lw = F * 0.075 / pts[2][2];
  ctx.strokeStyle = C['ink']; ctx.fillStyle = C['ink'];
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = lw;
  poly(pts[2], pts[3], pts[4]); poly(pts[2], pts[5], pts[6]);
  poly(pts[1], pts[7], pts[8]); poly(pts[1], pts[9], pts[10]);
  ctx.lineWidth = lw * 1.7; poly(pts[1], pts[2]);
  ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], F * 0.1 / pts[0][2], 0, TAU); ctx.fill();
}

function draw() {
  const ox = shake > 0.2 ? (Math.random() - 0.5) * shake : 0;
  const oy = shake > 0.2 ? (Math.random() - 0.5) * shake : 0;
  ctx.setTransform(DPR, 0, 0, DPR, ox * DPR, oy * DPR);
  const hz = CY - F * TA, vpx = W / 2 + shiftX;

  let g = ctx.createLinearGradient(0, 0, 0, hz);
  g.addColorStop(0, C['bg-top']); g.addColorStop(1, C['bg-bottom']);
  ctx.fillStyle = g; ctx.fillRect(-30, -30, W + 60, hz + 30);
  g = ctx.createLinearGradient(0, hz, 0, H);
  g.addColorStop(0, C['bg-bottom']); g.addColorStop(1, C['floor']);
  ctx.fillStyle = g; ctx.fillRect(-30, hz, W + 60, H - hz + 30);
  const rg = ctx.createRadialGradient(vpx, hz, 0, vpx, hz, Math.max(W, H) * 0.55);
  rg.addColorStop(0, C['glow']); rg.addColorStop(1, C['glow0']);
  ctx.fillStyle = rg; ctx.fillRect(-30, -30, W + 60, H + 60);

  drawTrack(hz);
  drawRipples();
  drawShadowAndSpot();
  drawTrail();
  drawFigure();
}

/* ---------- Input ---------- */
// Event timestamps share the frame clock; fall back to now if a browser reports something odd
function stamp(e) {
  const n = performance.now(), t = e && e.timeStamp;
  return (t > 0 && t <= n + 1 && n - t < 250) ? t : n;
}
function press(id, ts) {
  ensureAudio();
  if (S.mode === 'menu') { startGame(); return; }
  if (S.mode === 'over') { if (performance.now() - overAt > 380) startGame(); return; }
  if (S.mode === 'fall') return;
  pointers.add(id);
  if (!holding) {
    holding = true; holdAt = ts;
    if (S.mode === 'run' || S.mode === 'roundoff') judgeStart(ts);
    else if (S.mode === 'air') buzz(5);
  }
}
function release(id, ts) {
  pointers.delete(id);
  if (pointers.size === 0 && holding) { holding = false; holdAt = ts; }
}
function releaseAll() { pointers.clear(); holding = false; holdAt = performance.now(); }

window.addEventListener('pointerdown', e => {
  if (e.target && e.target.closest && e.target.closest("#snd, .portfolio-return")) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  press('p' + e.pointerId, stamp(e));
}, { passive: false });
['pointerup', 'pointercancel'].forEach(type => window.addEventListener(type, e => { release('p' + e.pointerId, stamp(e)); ensureAudio(); }));
const KEYS = ['Space', 'ArrowUp', 'Enter'];
window.addEventListener('keydown', e => {
  if (!KEYS.includes(e.code) || (e.target && e.target.closest && e.target.closest("#snd, .portfolio-return"))) return;
  e.preventDefault();
  if (!e.repeat) press('key', stamp(e));
});
window.addEventListener('keyup', e => { if (KEYS.includes(e.code)) release('key', stamp(e)); });
window.addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

sndBtn.addEventListener('click', e => {
  e.stopPropagation();
  soundOn = !soundOn; store.set('tumble.sound', soundOn ? '1' : '0');
  ensureAudio(); applySound();
});

/* ---------- Boot ---------- */
resize(); reset(); applySound();
bestMenu.textContent = profile.best > 0 ? 'Best ' + fmt(profile.best) : '';
window.addEventListener('resize', resize);
const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
if (mq) { if (mq.addEventListener) mq.addEventListener('change', readColors); else if (mq.addListener) mq.addListener(readColors); }
new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

let last = performance.now();
function frame(now) {
  const from = last, dt = Math.min(0.033, Math.max(0, (now - from) / 1000)); last = now;
  update(dt, from, now); updateAirSound(); draw(); updateLine();
  requestAnimationFrame(frame);
}
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
